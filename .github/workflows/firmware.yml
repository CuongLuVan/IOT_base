name: firmware

on:
  push:
    paths: ["DeviceIOT/**", "DeviceIOT8266/**", "tools/**", "Makefile", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["DeviceIOT/**", "DeviceIOT8266/**", "tools/**", "Makefile", ".github/workflows/firmware.yml"]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared files are identical
        run: bash tools/check_shared_files.sh
      - name: Core logic tests (ASan / UBSan)
        run: make test

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sketch: [DeviceIOT, DeviceIOT8266]
        # "all" also builds with every optional security feature on, so
        # disabled code cannot rot unnoticed (review item 29).
        features: [default, all]
        include:
          - sketch: DeviceIOT
            fqbn: esp32:esp32:esp32:PartitionScheme=huge_app
            core: esp32:esp32@3.2.1
            index: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - sketch: DeviceIOT8266
            fqbn: esp8266:esp8266:generic
            core: esp8266:esp8266@3.1.2
            index: https://arduino.esp8266.com/stable/package_esp8266com_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and libraries
        run: |
          arduino-cli core update-index --additional-urls "${{ matrix.index }}"
          arduino-cli core install "${{ matrix.core }}" --additional-urls "${{ matrix.index }}"
          arduino-cli lib install ArduinoJson@7.0.3 PubSubClient "DHT sensor library" "Adafruit Unified Sensor" LoRa "PMS Library"
      - name: Enable every optional feature
        if: matrix.features == 'all'
        run: |
          sed -i -E 's/^#define (ENABLE_ASCON_AEAD128|ENABLE_MESSAGE_AUTHENTICATION|ENABLE_MQTT_CONNECT_RATE_LIMIT|ENABLE_MQTT_USER_AUTH) 0/#define \1 1/' \
            ${{ matrix.sketch }}/config_features.h
      - name: Compile
        run: arduino-cli compile --fqbn "${{ matrix.fqbn }}" "${{ matrix.sketch }}"
