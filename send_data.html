<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Test Tool</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,.1);
}

h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

input[type=text],
select,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

textarea {
    min-height: 220px;
    font-family: Consolas, monospace;
    resize: vertical;
}

button {
    background: #007bff;
    color: white;
    border: none;
    padding: 10px 25px;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.response {
    margin-top: 20px;
}

#responseLabel {
    display: block;
    background: #1e1e1e;
    color: #00ff7f;
    padding: 15px;
    border-radius: 4px;
    min-height: 150px;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: Consolas, monospace;
}
</style>
</head>
<body>

<div class="container">

    <h2>API Request Tool</h2>

    <div class="form-group">
        <label>URL</label>
        <input
            type="text"
            id="url"
            placeholder="https://example.com/api">
    </div>

    <div class="form-group">
        <label>Method</label>
        <select id="method">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
        </select>
    </div>

    <div class="form-group">
        <label>JSON Data</label>
        <textarea id="jsonData">{
  "name": "test",
  "id": 123
}</textarea>
    </div>

    <button onclick="sendRequest()">
        Send Request
    </button>

    <div class="response">
        <label>Response</label>
        <pre id="responseLabel">Waiting...</pre>
    </div>

</div>

<script>

async function sendRequest() {

    const url = document.getElementById('url').value.trim();
    const method = document.getElementById('method').value;
    const jsonText = document.getElementById('jsonData').value;
    const responseLabel = document.getElementById('responseLabel');

    if (!url) {
        responseLabel.textContent = 'Vui lòng nhập URL';
        return;
    }

    responseLabel.textContent = 'Loading...';

    try {

        var options = {
            method: method,
            headers: {
                'Content-Type': 'application/json'
            }
        };

        if (method === 'POST') {
            options.body = JSON.stringify(JSON.parse(jsonText));
        }
		console.log(options);

        const response = await fetch(url, options);

        const contentType =
            response.headers.get('content-type') || '';

        let result;

        if (contentType.includes('application/json')) {
            result = await response.json();
            responseLabel.textContent =
                JSON.stringify(result, null, 2);
        } else {
            result = await response.text();
            responseLabel.textContent = result;
        }

    } catch (err) {

        responseLabel.textContent =
            'Error:\n' + err.message;

    }
}

</script>

</body>
</html>
