# Mosquitto 2.x port of mqttBroker/MqttBroker1885.js.
# Run from this folder:  mosquitto -c mosquitto.conf -v
# Relative paths below are resolved from the working directory.
# Run only one broker at a time; all of them listen on port 1885.

per_listener_settings false
# Every CONNECT goes through the iot_auth plugin (mTLS fingerprint or
# username/password); devices connect without a username, so anonymous
# connections must reach the plugin instead of being refused by mosquitto.
allow_anonymous true
# In-memory sessions, like MqttBroker1885.js.
persistence false

# --- enable_TLS_SSL: MQTTS on port 1885 -------------------------------------
# For plain MQTT remove certfile/keyfile/cafile/require_certificate/tls_*/
# ciphers* and set plugin_opt_enable_tls_certificate false and
# plugin_opt_enable_ecdsa false.
listener 1885
certfile ../mqttBroker/certs/server.crt
keyfile ../mqttBroker/certs/server.key

# --- enableTLSCertificate: mTLS, per-device certificate -----------------------
# Client certificates must be signed by ca.crt; the plugin then checks the
# fingerprint / CN in mqtt_device_certs.json.
cafile ../mqttBroker/certs/ca.crt
require_certificate true
use_identity_as_username false

# --- enableECDSA: TLS 1.2+ with ECDHE-ECDSA suites ---------------------------
# TLS 1.2 suites supported by ESP32 mbedTLS and ESP8266 BearSSL, plus the
# TLS 1.3 suites used by Node.js clients such as testMqtt.
tls_version tlsv1.2
ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256
ciphers_tls1.3 TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

# --- Broker logic (src/mosquitto_iot_auth.c) ---------------------------------
# Linux: build/mosquitto_iot_auth.so   Windows: build/Release/mosquitto_iot_auth.dll
plugin ./build/mosquitto_iot_auth.so
# Folder with certs/ and the mqtt_*.json rule files written by web_manager.
plugin_opt_broker_dir ../mqttBroker
plugin_opt_enable_tls_certificate true
plugin_opt_enable_ecdsa true
plugin_opt_enable_acl true
plugin_opt_enable_attack true
plugin_opt_enable_client_id false
plugin_opt_enable_message_authentication false
plugin_opt_enable_brute_force false
# Close the connection of a client whose publish is rejected, as the
# Node.js brokers do (mosquitto alone would only drop the message).
plugin_opt_disconnect_on_denied_publish true

log_type error
log_type warning
log_type notice
log_type information
